name: openreader-downloads
services:
  downloads:
    image: ghcr.io/gil906/openreader_mobile:v1.3.0
    pull_policy: never
    restart: unless-stopped
    ports:
      - "3005:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
