      <path d="M211 48H310M211 70H310M211 92H280" stroke="#506984" stroke-width="6" stroke-linecap="round"/>
      <rect x="207" y="114" width="105" height="22" rx="6" fill="#7ff5d5" opacity=".7"/>
      <path d="M218 181V206M234 166V221M250 151V236M266 172V215M282 159V228M298 181V206" stroke="url(#ink)" stroke-width="6" stroke-linecap="round"/>
      <circle cx="262" cy="252" r="11" fill="#7ff5d5"/>
      <path d="M259 247L267 252L259 257Z" fill="#0b1626"/>
