    <rect x="109" y="181" width="75" height="16" rx="6" fill="#7ff5d5" opacity=".6"/>
    <rect x="184" y="-25" width="156" height="300" rx="25" fill="#0b1626" stroke="#8ba9ff" stroke-width="3" transform="rotate(10 262 125)"/>
