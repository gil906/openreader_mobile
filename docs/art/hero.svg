<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title description">
  <title id="title">OpenReader Native — read it, hear it, keep it yours</title>
  <desc id="description">Original geometric illustration of a glowing book flowing into audio waves and a phone, on a dark background.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081320"/><stop offset="1" stop-color="#172840"/></linearGradient>
    <linearGradient id="ink" x2="1" y2="1"><stop stop-color="#7ff5d5"/><stop offset="1" stop-color="#8ba9ff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#93b3d4" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1280" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="560" rx="28" fill="url(#grid)"/>
  <circle cx="1050" cy="260" r="205" fill="#6de5cc" opacity=".04"/>
  <circle cx="1050" cy="260" r="150" fill="none" stroke="#80ecd4" stroke-opacity=".13"/>
  <g font-family="system-ui,sans-serif">
    <text x="72" y="92" fill="#7ff5d5" font-size="16" letter-spacing="4">OPENREADER / NATIVE ANDROID</text>
    <text x="68" y="190" fill="#f3f8ff" font-size="68" font-weight="750">Read it.</text>
    <text x="68" y="270" fill="#f3f8ff" font-size="68" font-weight="750">Hear it.</text>
    <text x="68" y="350" fill="url(#ink)" font-size="68" font-weight="750">Keep it yours.</text>
    <text x="72" y="414" fill="#acc0d9" font-size="22">PDF read-along. Local voices. Your choice.</text>
    <rect x="72" y="452" width="294" height="40" rx="20" fill="#7ff5d5" fill-opacity=".09" stroke="#7ff5d5" stroke-opacity=".3"/>
    <text x="92" y="478" fill="#aaf5e2" font-size="15" letter-spacing="1">GPL-3.0-OR-LATER / API 24+</text>
  </g>
  <g transform="translate(770 126)">
