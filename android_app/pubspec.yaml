name: openreader_native
description: Native PDF read-along client for your self-hosted OpenReader server.
publish_to: none
version: 1.3.0+6

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  just_audio: ^0.10.6
  pdfrx: ^2.11.0
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.2
  sherpa_onnx: ^2.0.1
  archive: ^4.6.0
  crypto: ^3.0.8
  path: ^1.9.1
  path_provider: ^2.1.6
  file_picker: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/licenses/espeak-ng-GPL-3.0.txt
    - assets/licenses/kokoro-Apache-2.0.txt
